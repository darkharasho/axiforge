<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AxiForge Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="titlebar" class="titlebar app-drag">
      <div class="titlebar__brand">
        <img class="titlebar__logo" src="./svg/axiforge-glyph.svg" alt="AxiForge" aria-hidden="true" />
        <span>Axi<span class="titlebar__brand-accent">Forge</span></span>
        <span class="titlebar__beta-badge">beta</span>
        <span id="updateVersionLabel" class="titlebar__version no-drag"></span>
        <span id="updateStatusPill" class="titlebar__pill hidden no-drag">
          <span class="titlebar__pill-spinner" aria-hidden="true"></span>
          <span id="updateStatusPillText" class="titlebar__pill-text"></span>
        </span>
        <button id="updateRestartBtn" class="titlebar__restart-btn hidden no-drag" type="button">
          <span class="titlebar__restart-icon" aria-hidden="true"></span>
          <span>Restart to Update</span>
        </button>
      </div>
      <div class="titlebar__controls no-drag">
        <button id="workspaceBtn" class="titlebar__workspace-btn" type="button" title="Workspace">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="5" r="3"/>
            <path d="M2 13c0-3.314 2.686-5 6-5s6 1.686 6 5"/>
          </svg>
          <span id="titlebarUser" class="titlebar__user"></span>
        </button>
        <button id="winMin" type="button" title="Minimize">
          <svg width="10" height="1" viewBox="0 0 10 1" fill="currentColor"><rect width="10" height="1"/></svg>
        </button>
        <button id="winMax" type="button" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
        </button>
        <button id="winClose" type="button" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="0" y1="0" x2="10" y2="10"/><line x1="10" y1="0" x2="0" y2="10"/></svg>
        </button>
      </div>
    </header>

    <div id="workspaceMenu" class="workspace-menu hidden">
      <div id="authRow" class="auth-row"></div>
      <div id="onboarding" class="onboarding"></div>
    </div>

    <div id="sync-banner" class="sync-banner" hidden></div>

    <div class="app-layout">
      <nav class="leftnav">
        <button class="leftnav__item leftnav__item--active" data-page="library" type="button">
          <svg class="leftnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6.87803V6C6 4.75736 7.00736 3.75 8.25 3.75H15.75C16.9926 3.75 18 4.75736 18 6V6.87803M6 6.87803C6.23458 6.79512 6.48702 6.75 6.75 6.75H17.25C17.513 6.75 17.7654 6.79512 18 6.87803M6 6.87803C5.12611 7.18691 4.5 8.02034 4.5 9V9.87803M18 6.87803C18.8739 7.18691 19.5 8.02034 19.5 9V9.87803M19.5 9.87803C19.2654 9.79512 19.013 9.75 18.75 9.75H5.25C4.98702 9.75 4.73458 9.79512 4.5 9.87803M19.5 9.87803C20.3739 10.1869 21 11.0203 21 12V18C21 19.2426 19.9926 20.25 18.75 20.25H5.25C4.00736 20.25 3 19.2426 3 18V12C3 11.0203 3.62611 10.1869 4.5 9.87803"/></svg>
          <span class="leftnav__label">Build Library</span>
        </button>
        <button class="leftnav__item" data-page="comps" type="button">
          <svg class="leftnav__icon" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M3 6a3 3 0 0 1 3-3h2.25a3 3 0 0 1 3 3v2.25a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6Zm9.75 0a3 3 0 0 1 3-3H18a3 3 0 0 1 3 3v2.25a3 3 0 0 1-3 3h-2.25a3 3 0 0 1-3-3V6ZM3 15.75a3 3 0 0 1 3-3h2.25a3 3 0 0 1 3 3V18a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-2.25Zm9.75 0a3 3 0 0 1 3-3H18a3 3 0 0 1 3 3V18a3 3 0 0 1-3 3h-2.25a3 3 0 0 1-3-3v-2.25Z" clip-rule="evenodd"/></svg>
          <span class="leftnav__label">Comps</span>
        </button>
        <button class="leftnav__item" data-page="editor" type="button">
          <svg class="leftnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16.8617 4.48667L18.5492 2.79917C19.2814 2.06694 20.4686 2.06694 21.2008 2.79917C21.9331 3.53141 21.9331 4.71859 21.2008 5.45083L10.5822 16.0695C10.0535 16.5981 9.40144 16.9868 8.68489 17.2002L6 18L6.79978 15.3151C7.01323 14.5986 7.40185 13.9465 7.93052 13.4178L16.8617 4.48667ZM16.8617 4.48667L19.5 7.12499M18 14V18.75C18 19.9926 16.9926 21 15.75 21H5.25C4.00736 21 3 19.9926 3 18.75V8.24999C3 7.00735 4.00736 5.99999 5.25 5.99999H10"/></svg>
          <span class="leftnav__label">Build Editor</span>
        </button>
      </nav>

      <div class="page-content">
        <!-- Secondary nav (horizontal bar for Build Editor) -->
        <nav id="subnav" class="subnav">
          <button id="editorBackBtn" class="subnav__back hidden" type="button"><svg class="subnav__back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 19.5L3 12M3 12L10.5 4.5M3 12H21"/></svg><span id="editorBackLabel">Back</span></button>
          <button class="subnav__item subnav__item--active" data-subtab="build" type="button"><svg class="subnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.75 13.5L14.25 2.25L12 10.5H20.25L9.75 21.75L12 13.5H3.75Z"/></svg> Build</button>
          <button class="subnav__item" data-subtab="equipment" type="button"><svg class="subnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.4194 15.1694L17.25 21C18.2855 22.0355 19.9645 22.0355 21 21C22.0355 19.9645 22.0355 18.2855 21 17.25L15.1233 11.3733M11.4194 15.1694L13.9155 12.1383C14.2315 11.7546 14.6542 11.5132 15.1233 11.3733M11.4194 15.1694L6.76432 20.8219C6.28037 21.4096 5.55897 21.75 4.79768 21.75C3.39064 21.75 2.25 20.6094 2.25 19.2023C2.25 18.441 2.59044 17.7196 3.1781 17.2357L10.0146 11.6056M15.1233 11.3733C15.6727 11.2094 16.2858 11.1848 16.8659 11.2338C16.9925 11.2445 17.1206 11.25 17.25 11.25C19.7353 11.25 21.75 9.23528 21.75 6.75C21.75 6.08973 21.6078 5.46268 21.3523 4.89779L18.0762 8.17397C16.9605 7.91785 16.0823 7.03963 15.8262 5.92397L19.1024 2.64774C18.5375 2.39223 17.9103 2.25 17.25 2.25C14.7647 2.25 12.75 4.26472 12.75 6.75C12.75 6.87938 12.7555 7.00749 12.7662 7.13411C12.8571 8.20956 12.6948 9.39841 11.8617 10.0845L11.7596 10.1686M10.0146 11.6056L5.90901 7.5H4.5L2.25 3.75L3.75 2.25L7.5 4.5V5.90901L11.7596 10.1686M10.0146 11.6056L11.7596 10.1686M18.375 18.375L15.75 15.75M4.86723 19.125H4.87473V19.1325H4.86723V19.125Z"/></svg> Equipment</button>
          <button class="subnav__item" data-subtab="notes" type="button"><svg class="subnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16.8617 4.48667L18.5492 2.79917C19.2814 2.06694 20.4686 2.06694 21.2008 2.79917C21.9331 3.53141 21.9331 4.71859 21.2008 5.45083L10.5822 16.0695C10.0535 16.5981 9.40144 16.9868 8.68489 17.2002L6 18L6.79978 15.3151C7.01323 14.5986 7.40185 13.9465 7.93052 13.4178L16.8617 4.48667ZM16.8617 4.48667L19.5 7.12499M18 14V18.75C18 19.9926 16.9926 21 15.75 21H5.25C4.00736 21 3 19.9926 3 18.75V8.24999C3 7.00735 4.00736 5.99999 5.25 5.99999H10"/></svg> Notes</button>
          <button class="subnav__item" data-subtab="comps" type="button"><svg class="subnav__icon" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg> Comps</button>
          <div class="subnav__actions">
            <span id="saveStatus" class="subnav__save-status"></span>
            <span id="syncStatus" class="subnav__sync-status"></span>
            <button id="saveBuildBtn" class="btn btn-secondary subnav__save-btn" type="button">
              <span id="saveDot" class="subnav__save-dot hidden"></span>
              Save
            </button>
            <button id="publishSiteBtn" class="btn btn-secondary" type="button">Publish</button>
            <div id="editorShareDropdown" class="editor-share-dropdown">
              <button type="button" class="btn btn-secondary editor-share-dropdown__trigger">
                Share <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="12" height="12"><path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg>
              </button>
              <div class="editor-share-dropdown__menu">
                <button type="button" class="editor-share-dropdown__item" data-action="copy-chat-link">
                  <svg width="14" height="14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5L16.5 6.25V13.75L10 17.5L3.5 13.75V6.25L10 2.5Z"/><path d="M6.25 7.9H8.75M11.25 7.9H13.75"/><circle cx="10" cy="7.9" r="1.25" fill="currentColor" stroke="none"/><path d="M6.25 10H8.75M11.25 10H13.75"/><circle cx="10" cy="10" r="1.25" fill="currentColor" stroke="none"/><path d="M6.25 12.1H8.75M11.25 12.1H13.75"/><circle cx="10" cy="12.1" r="1.25" fill="currentColor" stroke="none"/></svg>
                  Chat Link
                </button>
                <button type="button" class="editor-share-dropdown__item" data-action="copy-axicode">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M15.98 1.804a1 1 0 0 0-1.96 0l-.24 1.192a1 1 0 0 1-.784.785l-1.192.238a1 1 0 0 0 0 1.962l1.192.238a1 1 0 0 1 .785.785l.238 1.192a1 1 0 0 0 1.962 0l.238-1.192a1 1 0 0 1 .785-.785l1.192-.238a1 1 0 0 0 0-1.962l-1.192-.238a1 1 0 0 1-.785-.785l-.238-1.192ZM6.949 5.684a1 1 0 0 0-1.898 0l-.683 2.051a1 1 0 0 1-.633.633l-2.051.683a1 1 0 0 0 0 1.898l2.051.684a1 1 0 0 1 .633.632l.683 2.051a1 1 0 0 0 1.898 0l.683-2.051a1 1 0 0 1 .633-.633l2.051-.683a1 1 0 0 0 0-1.898l-2.051-.683a1 1 0 0 1-.633-.633L6.95 5.684ZM13.949 13.684a1 1 0 0 0-1.898 0l-.184.551a1 1 0 0 1-.632.633l-.551.183a1 1 0 0 0 0 1.898l.551.183a1 1 0 0 1 .633.633l.183.551a1 1 0 0 0 1.898 0l.184-.551a1 1 0 0 1 .632-.633l.551-.183a1 1 0 0 0 0-1.898l-.551-.184a1 1 0 0 1-.633-.632l-.183-.551Z"/></svg>
                  AxiCode
                </button>
                <div class="editor-share-dropdown__divider"></div>
                <button type="button" class="editor-share-dropdown__item" data-action="discord-copy">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M7 3.5A1.5 1.5 0 0 1 8.5 2h3A1.5 1.5 0 0 1 13 3.5v.21a7.522 7.522 0 0 1 4.593 3.443.75.75 0 0 1-.072.755l-.09.1a7.04 7.04 0 0 0-1.93 4.142v.247a2.25 2.25 0 0 1-.533 1.453l-1.395 1.674a.75.75 0 0 1-.577.272H6.004a.75.75 0 0 1-.577-.272L4.032 13.85a2.25 2.25 0 0 1-.533-1.452v-.247A7.04 7.04 0 0 0 1.57 8.008l-.091-.1a.75.75 0 0 1-.072-.756A7.522 7.522 0 0 1 7 3.71V3.5Z"/></svg>
                  Discord Copy
                </button>
                <button type="button" class="editor-share-dropdown__item" data-action="discord-embed">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M9.25 13.25a.75.75 0 0 0 1.5 0V4.636l2.955 3.129a.75.75 0 0 0 1.09-1.03l-4.25-4.5a.75.75 0 0 0-1.09 0l-4.25 4.5a.75.75 0 1 0 1.09 1.03L9.25 4.636v8.614Z"/><path d="M3.5 12.75a.75.75 0 0 0-1.5 0v2.5A2.75 2.75 0 0 0 4.75 18h10.5A2.75 2.75 0 0 0 18 15.25v-2.5a.75.75 0 0 0-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5Z"/></svg>
                  Discord Embed
                </button>
                <div class="editor-share-dropdown__divider"></div>
                <button type="button" class="editor-share-dropdown__item" data-action="copy-published-link" disabled title="Publish first">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                  Published Link
                </button>
              </div>
            </div>
            <div id="publishStatus" class="publish-status"></div>
            <div class="subnav__overflow">
              <button id="overflowMenuBtn" class="subnav__overflow-btn" type="button" title="More actions"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6.75 12C6.75 12.4142 6.41421 12.75 6 12.75C5.58579 12.75 5.25 12.4142 5.25 12C5.25 11.5858 5.58579 11.25 6 11.25C6.41421 11.25 6.75 11.5858 6.75 12Z"/><path d="M12.75 12C12.75 12.4142 12.4142 12.75 12 12.75C11.5858 12.75 11.25 12.4142 11.25 12C11.25 11.5858 11.5858 11.25 12 11.25C12.4142 11.25 12.75 11.5858 12.75 12Z"/><path d="M18.75 12C18.75 12.4142 18.4142 12.75 18 12.75C17.5858 12.75 17.25 12.4142 17.25 12C17.25 11.5858 17.5858 11.25 18 11.25C18.4142 11.25 18.75 11.5858 18.75 12Z"/></svg></button>
              <div id="overflowMenu" class="subnav__overflow-menu hidden">
                <button id="duplicateBuildBtn" class="subnav__overflow-item" type="button">
                  <svg class="subnav__overflow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 17.25V20.625C15.75 21.2463 15.2463 21.75 14.625 21.75H4.875C4.25368 21.75 3.75 21.2463 3.75 20.625V7.875C3.75 7.25368 4.25368 6.75 4.875 6.75H6.75C7.26107 6.75 7.76219 6.7926 8.25 6.87444M15.75 17.25H19.125C19.7463 17.25 20.25 16.7463 20.25 16.125V11.25C20.25 6.79051 17.0066 3.08855 12.75 2.37444C12.2622 2.2926 11.7611 2.25 11.25 2.25H9.375C8.75368 2.25 8.25 2.75368 8.25 3.375V6.87444M15.75 17.25H9.375C8.75368 17.25 8.25 16.7463 8.25 16.125V6.87444M20.25 13.5V11.625C20.25 9.76104 18.739 8.25 16.875 8.25H15.375C14.7537 8.25 14.25 7.74632 14.25 7.125V5.625C14.25 3.76104 12.739 2.25 10.875 2.25H9.75"/></svg> Duplicate
                </button>
                <button id="copyBuildBtn" class="subnav__overflow-item hidden" type="button">
                  <svg class="subnav__overflow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.25 6.75L22.5 12L17.25 17.25M6.75 17.25L1.5 12L6.75 6.75M14.25 3.75L9.75 20.25"/></svg> Copy JSON
                </button>
                <button id="pasteBuildBtn" class="subnav__overflow-item hidden" type="button">
                  <svg class="subnav__overflow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.6657 3.88789C15.3991 2.94272 14.5305 2.25 13.5 2.25H10.5C9.46954 2.25 8.60087 2.94272 8.33426 3.88789M15.6657 3.88789C15.7206 4.0825 15.75 4.28782 15.75 4.5C15.75 4.91421 15.4142 5.25 15 5.25H9C8.58579 5.25 8.25 4.91421 8.25 4.5C8.25 4.28782 8.27937 4.0825 8.33426 3.88789M15.6657 3.88789C16.3119 3.93668 16.9545 3.99828 17.5933 4.07241C18.6939 4.20014 19.5 5.149 19.5 6.25699V19.5C19.5 20.7426 18.4926 21.75 17.25 21.75H6.75C5.50736 21.75 4.5 20.7426 4.5 19.5V6.25699C4.5 5.149 5.30608 4.20014 6.40668 4.07241C7.04547 3.99828 7.68808 3.93668 8.33426 3.88789"/></svg> Paste JSON
                </button>
              </div>
            </div>
            <div class="game-mode-toggle">
              <button class="game-mode-toggle__btn game-mode-toggle__btn--active" data-mode="pve" type="button">PvE</button>
              <button class="game-mode-toggle__btn" data-mode="wvw" type="button">WvW</button>
            </div>
          </div>
        </nav>

        <!-- Build Editor page -->
        <div id="page-editor" class="page hidden">
          <main class="editor">

            <!-- Shared toolbar always visible in editor -->
            <section class="panel panel--toolbar">
              <div class="toolbar-grid">
                <label>
                  Build Title
                  <div class="title-input-group">
                    <input id="editorTitle" type="text" maxlength="140" placeholder="Power Reaper Roamer" />
                    <button id="chatLinkBtn" class="title-input-group__btn" type="button" title="Copy Chat Link">
                      <svg width="14" height="14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5L16.5 6.25V13.75L10 17.5L3.5 13.75V6.25L10 2.5Z"/><path d="M6.25 7.9H8.75M11.25 7.9H13.75"/><circle cx="10" cy="7.9" r="1.25" fill="currentColor" stroke="none"/><path d="M6.25 10H8.75M11.25 10H13.75"/><circle cx="10" cy="10" r="1.25" fill="currentColor" stroke="none"/><path d="M6.25 12.1H8.75M11.25 12.1H13.75"/><circle cx="10" cy="12.1" r="1.25" fill="currentColor" stroke="none"/></svg>
                      Chat Link
                    </button>
                  </div>
                </label>
                <label>
                  Profession / Elite Spec
                  <div id="professionSelect"></div>
                </label>
                <label>
                  Tags
                  <div id="tagsInput" class="tag-container">
                    <input class="tag-container__input" type="text" placeholder="Add tag…" />
                  </div>
                </label>
              </div>

            </section>

            <!-- Build subtab -->
            <div id="subtab-build" class="subtab">
              <section class="panel panel--skillbar">
                <div id="skillsHost" class="skills-host">
<div class="skel-skills">
  <div class="skel-skills__weapon-col">
    <div class="skel-skills__mechbar">
      <div class="skel skel-skills__mechslot"></div><div class="skel skel-skills__mechslot skel-d1"></div><div class="skel skel-skills__mechslot skel-d2"></div><div class="skel skel-skills__mechslot skel-d3"></div><div class="skel skel-skills__mechslot skel-d4"></div>
    </div>
    <div class="skel-skills__weapon-row">
      <div class="skel skel-skills__swap"></div>
      <div class="skel-skills__group">
        <div class="skel skel-skills__slot"></div><div class="skel skel-skills__slot skel-d1"></div><div class="skel skel-skills__slot skel-d2"></div><div class="skel skel-skills__slot skel-d3"></div><div class="skel skel-skills__slot skel-d4"></div>
      </div>
    </div>
  </div>
  <div class="skel skel-skills__orb skel-d2"></div>
  <div class="skel-skills__group">
    <div class="skel skel-skills__slot"></div><div class="skel skel-skills__slot skel-d1"></div><div class="skel skel-skills__slot skel-d2"></div><div class="skel skel-skills__slot skel-d3"></div><div class="skel skel-skills__slot skel-d4"></div>
  </div>
</div>
                </div>
              </section>

              <div class="specs-with-detail">
                <section class="panel specs-panel">
