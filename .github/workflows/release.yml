name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (uncheck for dry-run / signing test)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check main process syntax
        run: find src/main -name "*.js" | xargs -I{} node --check {}

      - name: Run tests
        run: npm test

  build:
    needs: [test]
    strategy:
      # One platform's failure must not cancel the others. mac signing depends on
      # secrets that expire (CSC_LINK / CSC_KEY_PASSWORD); with fail-fast the linux
      # and windows builds got cancelled mid-flight and nothing shipped at all.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage
          - os: windows-latest
            platform: win
            args: --win nsis
          - os: macos-latest
            platform: mac
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and renderer
        run: npm run build:site && npm run build:renderer
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Build the signing keychain ourselves rather than letting electron-builder do it.
      # When CSC_LINK is set, app-builder-lib creates a temporary keychain and then runs
      # `security set-key-partition-list -k $CSC_KEY_PASSWORD` (macCodeSign.js importCerts) —
      # but -k wants the *keychain* password, not the .p12 import password. That only gets
      # away with it while the keychain still happens to be unlocked, so signing failed
      # intermittently with "SecKeychainUnlock: The user name or passphrase you entered is
      # not correct" and took the whole mac build down with it. Handing electron-builder a
      # finished keychain via CSC_KEYCHAIN skips that code path entirely.
      - name: Prepare macOS signing keychain
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/axiforge-signing.keychain-db"
          kc_pw="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/signing-cert.p12"

          printf '%s' "$CSC_LINK" | base64 -d > "$p12"

          security create-keychain -p "$kc_pw" "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          # No argument = no lock timeout and no lock-on-sleep. The keychain has to stay
          # unlocked for the rest of the job or codesign starts prompting.
          security set-keychain-settings "$kc"
          # codesign only builds the certificate chain from keychains on the search list.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
          rm -f "$p12"

          # Fail here rather than letting electron-builder shrug and ship an unsigned app.
          if ! security find-identity -v "$kc" | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in the signing keychain." >&2
            security find-identity -v "$kc" >&2
            exit 1
          fi
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build and publish Electron distributables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_KEYCHAIN comes from the step above on macOS; deliberately no CSC_LINK, so
          # electron-builder resolves the identity from that keychain instead of making
          # its own. Notarization credentials are unaffected and ignored off macOS.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # publish=always for tag-pushed releases; never for manual
          # workflow_dispatch (artifacts upload separately for inspection)
          PUBLISH_MODE: ${{ (github.event_name == 'push' || inputs.publish) && 'always' || 'never' }}
        run: npx electron-builder ${{ matrix.args }} --publish $PUBLISH_MODE
        shell: bash

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist_out/*.exe
            dist_out/*.AppImage
            dist_out/*.dmg
            dist_out/*.zip
            dist_out/*.blockmap
            dist_out/latest*.yml
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    # Only run for actual tag pushes — workflow_dispatch dry-runs upload
    # artifacts in the build job and stop there.
    #
    # !cancelled() rather than the default success(): paired with fail-fast: false,
    # this lets a release go out with the platforms that did build when one platform
    # fails. The asset check below annotates whatever is missing so a partial release
    # is never silent.
    #
    # But !cancelled() is also true when `build` was SKIPPED because `test` failed, so
    # publish used to run with nothing to publish and die on "No release found for tag"
    # — a second, misleading red X on top of the real failure (v0.15.0). Gate on the
    # aggregated result instead: 'failure' means at least one platform built, so carry
    # on; 'skipped'/'cancelled' means none did, so there is nothing to do.
    if: ${{ !cancelled() && needs.build.result != 'skipped' && needs.build.result != 'cancelled' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          notes=$(awk -v ver="$tag" '
            $0 ~ "^## Version " ver "( |$)" { capture=1; next }
            capture && /^## Version v/ { exit }
            capture { print }
          ' RELEASE_NOTES.md)

          # Fail loudly if RELEASE_NOTES.md has no section for this tag. Without this,
          # a release cut without notes (e.g. a manual chore(release) commit) silently
          # publishes an empty GitHub body and a generic "new version available" Discord
          # post — which is how v0.7.5 shipped with no notes.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No RELEASE_NOTES.md section found for $tag. Add a '## Version $tag — <date>' entry and re-run." >&2
            exit 1
          fi

          # Match the release for this tag whether electron-builder left it as a draft
          # or already published it (it publishes non-draft when --publish always). The
          # PATCH below is idempotent — it just (re)writes the notes and ensures it's live.
          release_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!){
              repository(owner:$owner,name:$repo){
                releases(first:20,orderBy:{field:CREATED_AT,direction:DESC}){
                  nodes{ databaseId tagName isDraft }
                }
              }
            }' -F owner=darkharasho -F repo=axiforge \
            --jq ".data.repository.releases.nodes[] | select(.tagName==\"$tag\") | .databaseId" | head -1)

          if [ -z "$release_id" ]; then
            echo "No release found for tag $tag (expected electron-builder to have created it)" >&2
            exit 1
          fi

          gh api -X PATCH "repos/darkharasho/axiforge/releases/$release_id" \
            -f body="$notes" \
            -F draft=false

      - name: Flag missing platform artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')

          # A build matrix job can fail without cancelling the others now, so a release
          # can go out missing a platform. Say which, rather than letting users find out.
          missing=""
          printf '%s' "$assets" | grep -q '\.exe$'      || missing="$missing windows"
          printf '%s' "$assets" | grep -q '\.AppImage$' || missing="$missing linux"
          printf '%s' "$assets" | grep -qE '\.(dmg|zip)$' || missing="$missing macos"

          if [ -n "$missing" ]; then
            echo "::warning::Release $tag is missing artifacts for:$missing — check the build job for those platforms."
          else
            echo "All platform artifacts present for $tag."
          fi


      - name: Post to Discord
        if: ${{ vars.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          export TAG="$tag"
          export RELEASE_URL="https://github.com/darkharasho/axiforge/releases/tag/${tag}"
          NOTES=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || echo "")
          export NOTES

          # Split the notes across as many embeds/messages as they need. A single
          # embed description caps at 4096 characters and a whole message at 6000
          # across its embeds, so v0.18.0's 6.4k of notes used to be cut off at a
          # hard 3800 — the Discord post ended mid-sentence and announced none of
          # the bug fixes, which are always the last section. Splitting on the
          # "### " headings keeps every section whole and intact.
          python3 .github/scripts/discord-release-post.py > "$RUNNER_TEMP/payloads.ndjson"

          # One line of the file = one webhook message. Sequential, with a pause,
          # so the parts arrive in order and don't trip the webhook rate limit.
          while IFS= read -r payload; do
            [ -n "$payload" ] || continue
            code=$(printf '%s' "$payload" | curl -s -o /dev/stderr -w '%{http_code}' \
              -H "Content-Type: application/json" --data-binary @- "$DISCORD_WEBHOOK_URL")
            if [ "$code" != "200" ] && [ "$code" != "204" ]; then
              echo "::warning::Discord webhook returned HTTP $code for one part of the $tag post."
            fi
            sleep 1
          done < "$RUNNER_TEMP/payloads.ndjson"
