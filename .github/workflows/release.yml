name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (uncheck for dry-run / signing test)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check main process syntax
        run: find src/main -name "*.js" | xargs -I{} node --check {}

      - name: Run tests
        run: npm test

  build:
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage
          - os: windows-latest
            platform: win
            args: --win nsis
          - os: macos-latest
            platform: mac
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and renderer
        run: npm run build:site && npm run build:renderer
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build and publish Electron distributables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # mac signing + notarization — electron-builder ignores these
          # cleanly on non-macOS runners.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # publish=always for tag-pushed releases; never for manual
          # workflow_dispatch (artifacts upload separately for inspection)
          PUBLISH_MODE: ${{ (github.event_name == 'push' || inputs.publish) && 'always' || 'never' }}
        run: npx electron-builder ${{ matrix.args }} --publish $PUBLISH_MODE
        shell: bash

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist_out/*.exe
            dist_out/*.AppImage
            dist_out/*.dmg
            dist_out/*.zip
            dist_out/*.blockmap
            dist_out/latest*.yml
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    # Only run for actual tag pushes — workflow_dispatch dry-runs upload
    # artifacts in the build job and stop there.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          notes=$(awk -v ver="$tag" '
            $0 ~ "^## Version " ver "( |$)" { capture=1; next }
            capture && /^## Version v/ { exit }
            capture { print }
          ' RELEASE_NOTES.md)

          release_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!){
              repository(owner:$owner,name:$repo){
                releases(first:20,orderBy:{field:CREATED_AT,direction:DESC}){
                  nodes{ databaseId tagName isDraft }
                }
              }
            }' -F owner=darkharasho -F repo=axiforge \
            --jq ".data.repository.releases.nodes[] | select(.tagName==\"$tag\" and .isDraft==true) | .databaseId" | head -1)

          if [ -z "$release_id" ]; then
            echo "No draft found for tag $tag" >&2
            exit 1
          fi

          gh api -X PATCH "repos/darkharasho/axiforge/releases/$release_id" \
            -f name="$tag" \
            -f body="$notes" \
            -F draft=false

      - name: Post to Discord
        if: ${{ vars.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          release_url="https://github.com/darkharasho/axiforge/releases/tag/${tag}"
          notes=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || echo "")

          export TAG="$tag"
          export RELEASE_URL="$release_url"
          export NOTES="$notes"

          payload=$(python3 -c "
          import json, os

          tag = os.environ['TAG']
          release_url = os.environ['RELEASE_URL']
          notes = os.environ.get('NOTES', '')

          if len(notes) > 3800:
              notes = notes[:3800] + '\n\n*... see full notes on GitHub*'

          embed = {
              'title': f'AxiForge {tag}',
              'url': release_url,
              'description': notes or 'A new version of AxiForge is available!',
              'color': 0x5865F2,
              'thumbnail': {'url': 'https://raw.githubusercontent.com/darkharasho/axiforge/main/public/img/AxiForge-White.png'},
              'footer': {'text': 'AxiForge Release'},
          }

          print(json.dumps({
              'embeds': [embed],
          }))
          ")

          curl -s -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
