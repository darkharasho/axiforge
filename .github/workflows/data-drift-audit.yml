name: Data Drift Audit

# Keeps the committed GW2 data snapshots (professions, specializations, legends,
# upgrade IDs, relic facts) in sync with the API + wiki, and audits the
# wiki-derived data (relics, signets) for drift. When anything changes or drift
# is found, it opens/updates a single PR with the refreshed data and a summary —
# so drift is reviewed as a diff instead of discovered by users.

on:
  schedule:
    # Weekly, Thursday 12:00 UTC — a couple days after the usual Tuesday balance
    # patch, giving the wiki time to catch up before we snapshot it.
    - cron: '0 12 * * 4'
  workflow_dispatch:
    inputs:
      sync:
        description: 'Refresh committed data snapshots from API/wiki'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── Refresh committed snapshots from the API + wiki ──
      # Each sync writes its target file atomically (single writeFile at the end),
      # so a flaky wiki/API response leaves the existing file untouched. We let
      # individual syncs fail without aborting the whole run so one bad category
      # doesn't block the rest — the diff/audit steps report whatever landed.
      - name: Sync profession + specialization data (GW2 API)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync }}
        continue-on-error: true
        run: node scripts/sync-profession-data.mjs

      - name: Sync legends (GW2 API)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync }}
        continue-on-error: true
        run: node scripts/sync-legends.mjs

      - name: Sync upgrade IDs (wiki SMW)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync }}
        continue-on-error: true
        run: node scripts/sync-upgrade-ids.mjs

      - name: Sync relic facts (wiki scrape)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync }}
        continue-on-error: true
        run: node scripts/sync-relic-facts.mjs

      # ── Audit the wiki-derived data for drift ──
      # A mismatch is a signal for review, not a build failure, so these never
      # fail the job. CI=true keeps the status display from emitting TTY escapes.
      - name: Audit relics
        continue-on-error: true
        env:
          CI: 'true'
        run: npm run audit:wiki:relics

      - name: Audit signets
        continue-on-error: true
        env:
          CI: 'true'
        run: npm run audit:wiki:signets

      - name: Build audit summary
        id: summary
        run: |
          node scripts/audit-report-md.mjs > audit-summary.md
          cat audit-summary.md

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: wiki-audit-reports
          path: tests/wiki-audit/results/*.json
          if-no-files-found: warn
          retention-days: 30

      # ── Detect changes to committed data and open/update a PR ──
      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- src/main/gw2Data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No committed data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changed:"
            git diff --stat -- src/main/gw2Data
          fi

      - name: Open or update data-sync PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/data-sync"
          DATE=$(date -u +%Y-%m-%d)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recreate the branch from the current commit each run so the PR always
          # reflects the latest snapshot rather than accumulating stale commits.
          git checkout -B "$BRANCH"
          git add src/main/gw2Data
          git commit -m "chore(data): sync GW2 API/wiki snapshots ($DATE)"
          git push --force-with-lease origin "$BRANCH"

          BODY_FILE=pr-body.md
          {
            echo "Automated refresh of the committed GW2 data snapshots from the API and wiki."
            echo
            cat audit-summary.md
            echo
            echo "---"
            echo "_Generated by the Data Drift Audit workflow. Review the diff before merging — the wiki can lag or mis-render after a balance patch._"
          } > "$BODY_FILE"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "chore(data): sync GW2 snapshots ($DATE)" --body-file "$BODY_FILE"
            echo "Updated existing PR."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(data): sync GW2 snapshots ($DATE)" \
              --body-file "$BODY_FILE"
            echo "Opened new PR."
          fi

      - name: No changes — report clean
        if: steps.changes.outputs.changed == 'false'
        run: echo "Snapshots already in sync; audit summary uploaded as an artifact."
