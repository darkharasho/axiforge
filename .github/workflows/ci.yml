# Tests used to run ONLY on tag push (release.yml), so the first time anything
# went red was mid-release, with a tag already cut. This runs the same checks on
# every push to main and every PR, so a break is caught before it can block a
# release. Tag pushes don't match `branches:`, so this never doubles up with
# release.yml.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same two checks release.yml gates on, in the same order and on the same
      # node version. Keep them in sync: anything added there belongs here too.
      - name: Check main process syntax
        run: find src/main -name "*.js" | xargs -I{} node --check {}

      - name: Run tests
        run: npm test

  # The browser suites, which `npm test` does not cover: the SPA viewer and the
  # web playground. Both are seconds and neither needs Electron, so they belong
  # on every push. The Electron e2e suite does NOT — it is minutes and memory
  # bound; it runs nightly instead (nightly-e2e.yml).
  web:
    name: Playwright (SPA + playground)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # src/web/public/catalogs is git-ignored and generated, and the playground
      # cannot render a profession without it — the specs fail on a bare
      # checkout otherwise. Offline: it bakes from the repo's own snapshots.
      - name: Bake web catalogs
        run: npm run bake:catalogs

      - name: SPA suite
        run: npm run test:spa

      - name: Playground suite
        run: npm run test:playground

      # Neither config sets an HTML reporter, so what a failure leaves behind is
      # the trace/screenshot output under test-results (trace: on-first-retry).
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-web
          path: '**/test-results/'
          retention-days: 7
