# Cloudflare Worker: build.axi.link short-link shortener + SPA host.
#
# Deploy: from workers/share-shortener/  ->  npx wrangler deploy
# One-time KV setup:
#   npx wrangler kv namespace create SHARE_SLUGS
#   npx wrangler kv namespace create SHARE_SLUGS --preview
# then paste the returned ids below.

name = "axiforge-share-shortener"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Static SPA assets (the vite build output). The Worker serves these for every
# route it doesn't handle, and serves index.html for /b/<slug> navigations.
[assets]
directory = "../../dist/web"
binding = "ASSETS"
# SPA fallback so client-side routes resolve to index.html.
not_found_handling = "single-page-application"

# slug -> {code, name}. Fill in ids from the `wrangler kv namespace create` output.
[[kv_namespaces]]
binding = "SHARE_SLUGS"
id = "REPLACE_WITH_SHARE_SLUGS_ID"
preview_id = "REPLACE_WITH_SHARE_SLUGS_PREVIEW_ID"

# Route the build.axi.link zone through this Worker. Adjust zone_name if needed.
[[routes]]
pattern = "build.axi.link/*"
zone_name = "axi.link"
